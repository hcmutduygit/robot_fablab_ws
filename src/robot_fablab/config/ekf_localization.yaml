frequency: 30
sensor_timeout: 0.1
two_d_mode: true
publish_tf: true
publish_acceleration: false
imu0_remove_gravitational_acceleration: true
map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

# ===============================
# WHEEL ODOMETRY (ENCODER)
# ===============================
odom0: /wheel_odometry
odom0_queue_size: 10
odom0_nodelay: true
odom0_differential: false
odom0_relative: false

odom0_config:
  [ true,  true,  false,   # x, y, z
    false, false, false,    # roll, pitch, yaw
    true,  false, false,   # vx, vy, vz
    false, false, true,    # vroll, vpitch, vyaw
    false, false, false ]  # ax, ay, az

# ===============================
# IMU
# ===============================
imu0: /imu/data
imu0_queue_size: 50
imu0_nodelay: true
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: true

imu0_config:
  [ false, false, false,
    false,  false,  true,
    false, false, false,
    false,  false,  true,
    false, false, false ]
